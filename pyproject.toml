[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jsform-desktop"
dynamic = ["version"]
description = "A wxPython framework for database-backed desktop applications defined with JSON"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Rev. Jonathan C. Watt"},
]
keywords = ["desktop", "forms", "json", "mariadb", "mysql", "wxpython"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "jsonschema>=4.18,<5",
    "mysql-connector-python>=8,<27",
    "Pillow>=9.5,<13",
    "reportlab>=4.2,<5",
    "requests>=2.28,<3",
    "screeninfo>=0.8,<1",
    "wxPython>=4.2,<5",
    "yagmail>=0.15,<1",
]

[project.urls]
Homepage = "https://jwattswhat.github.io/JSForm-Website/"
Documentation = "https://github.com/jwattswhat/JSForm/blob/main/Documentation/JSForm_Framework.md"
Repository = "https://github.com/jwattswhat/JSForm"
Issues = "https://github.com/jwattswhat/JSForm/issues"
Security = "https://github.com/jwattswhat/JSForm/security"

[project.optional-dependencies]
development = [
    "build>=1.2,<2",
]

[tool.setuptools]
packages = ["JSForm"]
package-dir = {JSForm = "."}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "JSForm.version.__version__"}

[tool.setuptools.package-data]
JSForm = [
    "Forms/*.json",
    "schema/*.json",
]
